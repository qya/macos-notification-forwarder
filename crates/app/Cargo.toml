[package]
name = "macos-notification-forwarder"
version = "0.1.0"
edition = "2021"
default-run = "notification-forwarder"

[[bin]]
name = "notification-forwarder"
path = "src/main.rs"

[dependencies]
nf-accessibility = { path = "../accessibility" }
nf-config = { path = "../config" }
nf-notification = { path = "../notification" }
nf-webhook = { path = "../webhook" }
axuielement = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# GPUI is pre-1.0 () and stays a thin, optional presentation layer
# (). Pinned exactly; off by default so `cargo build` stays fast and
# the notification engine can be verified without compiling a GPU UI stack.
gpui = { version = "=0.2.2", optional = true }

[features]
default = []
gpui-ui = ["dep:gpui"]
